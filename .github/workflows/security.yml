# Security(Phase 4): SAST(Semgrep)、SCA + secret + misconfig(Trivy)、依存差分レビュー、Scorecard。
# ci.yml と同様に security-ok を 1 つの required check として Rulesets に登録する。
# CodeQL は重いので nightly.yml(schedule)で回す。
name: Security
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: sast / semgrep (custom rules + p/default)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install --quiet semgrep==1.176.0
      - name: rule tests (ルール自体の回帰テスト)
        run: semgrep --test policies/semgrep --metrics=off
      - name: scan
        run: |
          semgrep scan --config policies/semgrep --config p/default \
            --exclude 'policies/semgrep/*.ts' --exclude 'policies/semgrep/*.py' \
            --metrics=off --error --sarif --output semgrep.sarif . || status=$?
          semgrep scan --config policies/semgrep --config p/default \
            --exclude 'policies/semgrep/*.ts' --exclude 'policies/semgrep/*.py' --metrics=off --quiet . || true
          exit "${status:-0}"
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
    permissions:
      contents: read
      security-events: write

  trivy:
    name: sca / trivy fs (vuln, secret, misconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ゲート: HIGH 以上で fail。table 出力なのでログで理由が読める。
      # (trivy-action は format=sarif の時 "all severities" でレポートを作り、exit-code も全件に効くので gate と分ける)
      - name: gate (HIGH/CRITICAL, table)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0 # ローカルの trivy と揃える
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-dirs: node_modules,.venv
      # レポート: 全 severity を SARIF で Security タブへ。merge はブロックしない。
      - name: report (all severities, sarif)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scanners: vuln,secret,misconfig
          exit-code: "0"
          format: sarif
          output: trivy.sarif
          skip-dirs: node_modules,.venv
          skip-setup-trivy: true
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

  # PR で増えた依存だけを見る(脆弱性・ライセンス)。lockfile 全体は trivy が見る。public repo では無償。
  dependency-review:
    name: sca / dependency review (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, CC0-1.0, MPL-2.0, Unlicense, Python-2.0, BlueOak-1.0.0
          comment-summary-in-pr: on-failure

  # Dockerfile / Terraform / workflows / Rego ポリシー。ローカルと同じ scripts/verify.sh --only infra を実行する。
  infra:
    name: infra / hadolint, actionlint, zizmor, terraform, trivy config, conftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-infra-tools
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: scripts/verify.sh --only infra

  security-ok:
    name: security-ok
    if: always()
    needs: [semgrep, trivy, dependency-review, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -Eq '"result": *"(failure|cancelled)"'; then exit 1; fi

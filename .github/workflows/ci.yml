# CI Phase 5: 静的ゲート + unit/integration test + coverage(報告のみ)+ secret scan + docker build + image scan。
# hooks と同じ scripts/verify.sh を「全体」に対して実行する。ローカルで回避されていないことの保証が目的。
# 変更されたパスに応じて言語ごとの job を skip する。skip された job は required check では成功扱いになる。
name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      py: ${{ steps.filter.outputs.py }}
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ts:
              - 'apps/**'
              - 'packages/**'
              - 'biome.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/verify.sh'
              - 'scripts/verify/ts.sh'
              - 'scripts/verify/_lib.sh'
              - '.github/workflows/ci.yml'
            docker:
              - '**/Dockerfile'
              - '.dockerignore'
              - 'infra/docker/**'
              - 'apps/**'
              - 'services/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            go:
              - 'services/shortener/**'
              - 'scripts/verify.sh'
              - 'scripts/verify/go.sh'
              - 'scripts/verify/_lib.sh'
              - '.github/workflows/ci.yml'
            py:
              - 'services/**'
              - 'scripts/verify.sh'
              - 'scripts/verify/py.sh'
              - 'scripts/verify/_lib.sh'
              - '.github/workflows/ci.yml'

  ts:
    name: ts / biome + tsc
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/verify.sh --only ts
      - name: coverage summary (report only, never a gate)
        if: always()
        run: |
          {
            echo "### Coverage (ts)"; echo; echo "| package | lines | branches | functions |"; echo "|---|---|---|---|"
            for f in apps/*/coverage/coverage-summary.json packages/*/coverage/coverage-summary.json; do
              [ -f "$f" ] || continue
              pkg="$(dirname "$(dirname "$f")")"
              jq -r --arg p "$pkg" '.total | "| \($p) | \(.lines.pct)% | \(.branches.pct)% | \(.functions.pct)% |"' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  py:
    name: py / ruff + basedpyright
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: services/**/uv.lock
      - run: uv sync --locked --all-groups
        working-directory: services/enricher
      - run: scripts/verify.sh --only py
      - name: coverage summary (report only, never a gate)
        if: always()
        run: |
          f=services/enricher/coverage.json
          if [ -f "$f" ]; then
            {
              echo "### Coverage (py)"; echo
              jq -r '.totals | "services/enricher: lines \(.percent_covered_display)% (\(.covered_lines)/\(.num_statements))"' "$f"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # UI smoke(Playwright)。API は page.route でモックするので DB もサービスも要らない。
  # 全サービス結合の E2E は compose(ローカル)で行い、CI には載せない(コストと flakiness)。
  e2e:
    name: web / playwright smoke (mocked api)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shelf/web exec playwright install --with-deps chromium
      - run: pnpm --filter @shelf/web test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  go:
    name: go / vet, golangci-lint, test -race, govulncheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/shortener/go.mod
          cache-dependency-path: services/shortener/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2 # ローカル(brew)と揃える
          working-directory: services/shortener
          args: --help # 導入だけ行い、実行は verify.sh に統一する
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: scripts/verify.sh --only go

  # image がビルドできること自体をゲートにする(push はしない)。
  docker:
    name: docker / build images
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ., file: apps/api/Dockerfile }
          - { name: web, context: ., file: apps/web/Dockerfile }
          - { name: enricher, context: services/enricher, file: services/enricher/Dockerfile }
          - { name: shortener, context: services/shortener, file: services/shortener/Dockerfile }
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: shelf-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      # ビルドした image の OS パッケージ・言語依存の既知 CVE(HIGH 以上、修正版あり)。Dockerfile の lint とは別物。
      - name: trivy image (HIGH/CRITICAL, fixed only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: shelf-${{ matrix.name }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  secrets:
    name: secrets / gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # 履歴全体を見る。pre-commit(staged のみ)と役割が違う
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "true"

  # Rulesets の required check にはこの 1 つだけを登録する。
  # 言語 job が増減しても ruleset を触らずに済み、skip された job も正しく成功扱いになる。
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, ts, py, go, e2e, docker, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - name: fail if any needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -Eq '"result": *"(failure|cancelled)"'; then exit 1; fi

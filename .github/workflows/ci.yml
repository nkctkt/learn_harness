# CI Phase 1: 静的ゲート(format / lint / typecheck)。
# hooks と同じ scripts/verify.sh を「全体」に対して実行する。ローカルで回避されていないことの保証が目的。
# 変更されたパスに応じて言語ごとの job を skip する。skip された job は required check では成功扱いになる。
name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      py: ${{ steps.filter.outputs.py }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            ts:
              - 'apps/**'
              - 'packages/**'
              - 'biome.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/verify.sh'
              - 'scripts/verify/ts.sh'
              - 'scripts/verify/_lib.sh'
              - '.github/workflows/ci.yml'
            py:
              - 'services/**'
              - 'scripts/verify.sh'
              - 'scripts/verify/py.sh'
              - 'scripts/verify/_lib.sh'
              - '.github/workflows/ci.yml'

  ts:
    name: ts / biome + tsc
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/verify.sh --only ts

  py:
    name: py / ruff + basedpyright
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: services/**/uv.lock
      - run: uv sync --locked --all-groups
        working-directory: services/enricher
      - run: scripts/verify.sh --only py

  # Rulesets の required check にはこの 1 つだけを登録する。
  # 言語 job が増減しても ruleset を触らずに済み、skip された job も正しく成功扱いになる。
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, ts, py]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: fail if any needed job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          echo '${{ toJSON(needs) }}' | grep -Eq '"result": *"(failure|cancelled)"' && exit 1 || exit 0

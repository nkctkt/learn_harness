# CI Phase 5: 静的ゲート + unit/integration test + coverage(報告のみ)+ secret scan + docker build + image scan。
# hooks と同じ scripts/verify.sh を「全体」に対して実行する。ローカルで回避されていないことの保証が目的。
# 変更されたパスに応じて言語ごとの job を skip する。skip された job は required check では成功扱いになる。
name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      py: ${{ steps.filter.outputs.py }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            ts:
              - 'apps/**'
              - 'packages/**'
              - 'biome.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/verify.sh'
              - 'scripts/verify/ts.sh'
              - 'scripts/verify/_lib.sh'
              - '.github/workflows/ci.yml'
            docker:
              - '**/Dockerfile'
              - '.dockerignore'
              - 'infra/docker/**'
              - 'apps/**'
              - 'services/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            py:
              - 'services/**'
              - 'scripts/verify.sh'
              - 'scripts/verify/py.sh'
              - 'scripts/verify/_lib.sh'
              - '.github/workflows/ci.yml'

  ts:
    name: ts / biome + tsc
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/verify.sh --only ts
      - name: coverage summary (report only, never a gate)
        if: always()
        run: |
          {
            echo "### Coverage (ts)"; echo; echo "| package | lines | branches | functions |"; echo "|---|---|---|---|"
            for f in apps/*/coverage/coverage-summary.json packages/*/coverage/coverage-summary.json; do
              [ -f "$f" ] || continue
              pkg="$(dirname "$(dirname "$f")")"
              jq -r --arg p "$pkg" '.total | "| \($p) | \(.lines.pct)% | \(.branches.pct)% | \(.functions.pct)% |"' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  py:
    name: py / ruff + basedpyright
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: services/**/uv.lock
      - run: uv sync --locked --all-groups
        working-directory: services/enricher
      - run: scripts/verify.sh --only py
      - name: coverage summary (report only, never a gate)
        if: always()
        run: |
          f=services/enricher/coverage.json
          [ -f "$f" ] && {
            echo "### Coverage (py)"; echo
            jq -r '.totals | "services/enricher: lines \(.percent_covered_display)% (\(.covered_lines)/\(.num_statements))"' "$f"
          } >> "$GITHUB_STEP_SUMMARY" || true

  # image がビルドできること自体をゲートにする(push はしない)。脆弱性スキャンは Phase 5 で追加。
  docker:
    name: docker / build images
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ., file: apps/api/Dockerfile }
          - { name: web, context: ., file: apps/web/Dockerfile }
          - { name: enricher, context: services/enricher, file: services/enricher/Dockerfile }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: shelf-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      # ビルドした image の OS パッケージ・言語依存の既知 CVE(HIGH 以上、修正版あり)。Dockerfile の lint とは別物。
      - name: trivy image (HIGH/CRITICAL, fixed only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: shelf-${{ matrix.name }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  secrets:
    name: secrets / gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0 # 履歴全体を見る。pre-commit(staged のみ)と役割が違う
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "true"

  # Rulesets の required check にはこの 1 つだけを登録する。
  # 言語 job が増減しても ruleset を触らずに済み、skip された job も正しく成功扱いになる。
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, ts, py, docker, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - name: fail if any needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | grep -Eq '"result": *"(failure|cancelled)"' && exit 1 || exit 0

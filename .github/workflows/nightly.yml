# Nightly(Phase 4): PR ごとに回すには重い・遅いものをここで回す。
# - CodeQL: データフロー解析。Semgrep(パターン)より深いが数分かかる。public repo では無償。
# - Trivy(vuln): 「昨日は無かった CVE」を lockfile が変わらなくても検出する(PR 時スキャンでは拾えない)。
# - OpenSSF Scorecard: リポジトリ運用の健全性(pin、branch protection、token 権限)。
# 結果は Security タブ(code scanning alerts)に集約し、merge はブロックしない。
name: Nightly
on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: sast / codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: javascript-typescript, build-mode: none }
          - { language: python, build-mode: none }
          - { language: actions, build-mode: none }
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: codeql/${{ matrix.language }}

  trivy-drift:
    name: sca / trivy (new CVEs since yesterday)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0 # ローカルの trivy と揃える(action 同梱版は古く挙動が違った)
          scan-type: fs
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: trivy-nightly.sarif
          skip-dirs: node_modules,.venv
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-nightly.sarif
          category: trivy-nightly

  # Mutation testing: 実装を壊してテストが落ちるかを見る(同語反復・assertion 不足の数値化)。
  # 数分かかるので週次。スコアは job summary に出し、ゲートにはしない(下がった時に人が読む)。
  mutation-ts:
    name: test-quality / stryker (apps/api)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shelf/api test:mutation
      - name: summary
        if: always()
        run: |
          f=apps/api/reports/mutation/mutation.json
          if [ -f "$f" ]; then
            {
              echo "### Mutation score (apps/api)"; echo
              jq -r '[.files[] | .mutants[]] | group_by(.status) | map("\(.[0].status): \(length)") | join(", ")' "$f"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  mutation-py:
    name: test-quality / mutmut (services/enricher)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --all-groups
        working-directory: services/enricher
      - run: uv run mutmut run
        working-directory: services/enricher
      - name: summary
        if: always()
        working-directory: services/enricher
        run: |
          {
            echo "### Mutation results (services/enricher)"; echo; echo '```'
            uv run mutmut results 2>/dev/null | grep -cE 'killed' | sed 's/^/killed: /' || true
            uv run mutmut results 2>/dev/null | grep -cE 'survived' | sed 's/^/survived: /' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  scorecard:
    name: supply-chain / openssf scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit # まず観測。想定外の宛先が無いことを確認してから block に切り替える(Phase 8)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard

# Nightly(Phase 4): PR ごとに回すには重い・遅いものをここで回す。
# - CodeQL: データフロー解析。Semgrep(パターン)より深いが数分かかる。public repo では無償。
# - Trivy(vuln): 「昨日は無かった CVE」を lockfile が変わらなくても検出する(PR 時スキャンでは拾えない)。
# - OpenSSF Scorecard: リポジトリ運用の健全性(pin、branch protection、token 権限)。
# 結果は Security タブ(code scanning alerts)に集約し、merge はブロックしない。
name: Nightly
on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: sast / codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: javascript-typescript, build-mode: none }
          - { language: python, build-mode: none }
          - { language: actions, build-mode: none }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: codeql/${{ matrix.language }}

  trivy-drift:
    name: sca / trivy (new CVEs since yesterday)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: trivy-nightly.sarif
          skip-dirs: node_modules,.venv
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-nightly.sarif
          category: trivy-nightly

  scorecard:
    name: supply-chain / openssf scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard

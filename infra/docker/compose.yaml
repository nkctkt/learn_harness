# ローカル開発と結合確認用。本番相当の値は置かない。
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD: shelf   # ローカル専用のダミー値
      POSTGRES_DB: shelf
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf -d shelf"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgres://shelf:shelf@db:5432/shelf   # allow-secret: compose 内のローカル専用ダミー
      ENRICHER_URL: http://enricher:8000
      SHORTENER_URL: http://shortener:8081
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
      enricher: { condition: service_started }
      shortener: { condition: service_started }

  enricher:
    build: { context: ../../services/enricher }
    ports: ["8000:8000"]

  shortener:
    build: { context: ../../services/shortener }
    ports: ["8081:8081"]

  web:
    build: { context: ../.., dockerfile: apps/web/Dockerfile }
    ports: ["8080:8080"]
    depends_on: [api]

volumes:
  db-data:

# 依存更新。cooldown で「公開直後の版」を避ける(悪性版の多くは公開後数日で取り下げられる)。
# 更新 PR は通常の CI(ci-ok / security-ok)を通る。自動 merge はしない。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Tokyo }
    cooldown: { default-days: 7, semver-major-days: 30 }
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime-minor:
        dependency-type: production
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directory: / # TODO: uv プロジェクトのパス
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Tokyo }
    cooldown: { default-days: 7, semver-major-days: 30 }
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/] # TODO: Dockerfile のあるディレクトリ
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Tokyo }
    cooldown: { default-days: 7 }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Tokyo }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
